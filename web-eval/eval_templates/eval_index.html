{% extends "eval_base.html" %}

{% block title %}Evaluasi Sistem — myDhamma{% endblock %}

{% block header_subtitle %}
<span class="header-subtitle">Beranda</span>
{% endblock %}

{% block main_panel %}
<style>
    .index-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        gap: 2rem;
        padding: 2rem;
    }

    .index-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-muted);
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .index-groups {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 480px;
    }

    .index-group {
        background: var(--bg-secondary, #f8f7ff);
        border: 1px solid var(--border-color);
        border-radius: 1rem;
        padding: 0.75rem;
    }

    html.dark .index-group {
        background: rgba(255, 255, 255, 0.04);
    }

    .index-group-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 0.6rem;
        padding-left: 0.25rem;
    }

    .index-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.6rem;
    }

    .index-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
        padding: 1.25rem 1rem;
        border-radius: 0.65rem;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--text-color);
        text-decoration: none;
        font-weight: 500;
        transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .index-btn:hover {
        background: var(--bg-hover, #f3f0ff);
        border-color: var(--accent, #a255ff);
        box-shadow: 0 4px 12px rgba(162, 85, 255, 0.12);
    }

    .index-btn.done {
        opacity: 0.6;
        pointer-events: none;
    }

    .index-btn .btn-label {
        font-size: 1rem;
    }

    .index-btn .btn-sub {
        font-size: 0.75rem;
        color: var(--text-muted);
    }
</style>

<div class="index-wrap">
    <div class="index-groups">
        <div class="index-group">
            <div class="index-group-label">Penilaian Pakar</div>
            <div class="index-grid">
                <a href="/1" class="index-btn">
                    <i data-lucide="clipboard-pen" style="width:28px;height:28px;color:#a255ff"></i>
                    <span class="btn-label">Form</span>
                    <span class="btn-sub">Asesmen pakar</span>
                </a>
                <a href="/1/output" class="index-btn">
                    <i data-lucide="table-2" style="width:28px;height:28px;color:#a255ff"></i>
                    <span class="btn-label">Output</span>
                    <span class="btn-sub">Hasil & grafik</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
